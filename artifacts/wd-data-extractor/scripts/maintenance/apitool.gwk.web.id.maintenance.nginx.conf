# =====================================================================
# Nginx config: MAINTENANCE MODE for apitool.gwk.web.id
# =====================================================================
# Mengembalikan HTTP 503 + halaman maintenance custom.
# Cert SSL Let's Encrypt sudah terpasang di /etc/letsencrypt/live/.
# Site lain di VPS yang sama TIDAK terpengaruh.
# =====================================================================

# --- HTTPS (port 443) -------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name apitool.gwk.web.id;

    ssl_certificate     /etc/letsencrypt/live/apitool.gwk.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apitool.gwk.web.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/maintenance/apitool;
    index maintenance.html;

    # Jangan cache halaman maintenance.
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Retry-After "1800" always;

    # Asset di folder maintenance disajikan langsung (untuk halaman itu sendiri).
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
    }

    # Semua request lain → 503 + halaman maintenance.
    location / {
        return 503;
    }

    error_page 503 @maintenance;
    location @maintenance {
        rewrite ^(.*)$ /maintenance.html break;
    }
}

# --- HTTP (port 80) → redirect ke HTTPS -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name apitool.gwk.web.id;
    return 301 https://$host$request_uri;
}
