<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sedang Dalam Pemeliharaan — apitool.gwk.web.id</title>
    <style>
        :root {
            color-scheme: dark;
            --bg-1: #0b1020;
            --bg-2: #131a2f;
            --accent: #6366f1;
            --accent-2: #22d3ee;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 600px at 10% -10%, rgba(99, 102, 241, 0.25), transparent 60%),
                radial-gradient(1000px 500px at 110% 110%, rgba(34, 211, 238, 0.18), transparent 60%),
                linear-gradient(180deg, var(--bg-1), var(--bg-2));
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .card {
            width: 100%;
            max-width: 560px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 32px;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.45);
        }

        .icon svg {
            width: 36px;
            height: 36px;
            color: white;
            animation: spin 4s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
            letter-spacing: -0.01em;
        }

        p {
            margin: 0 0 12px;
            color: var(--muted);
            line-height: 1.6;
            font-size: 15px;
        }

        .domain {
            display: inline-block;
            margin-top: 18px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(99, 102, 241, 0.15);
            color: #c7d2fe;
            font-size: 13px;
            font-family: "JetBrains Mono", "Fira Code", ui-monospace, Menlo, monospace;
        }

        .meta {
            margin-top: 22px;
            font-size: 12px;
            color: var(--muted);
            opacity: 0.85;
        }

        .dots {
            display: inline-flex;
            gap: 6px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-2);
            animation: bounce 1.2s infinite ease-in-out;
        }

        .dots span:nth-child(2) { animation-delay: 0.15s; }
        .dots span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <main class="wrap">
        <section class="card" role="status" aria-live="polite">
            <div class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            </div>
            <h1>Sedang Dalam Pemeliharaan</h1>
            <p>
                Layanan ini sementara tidak tersedia karena sedang dilakukan
                pembaruan dan perbaikan sistem.
            </p>
            <p>
                Mohon coba kembali beberapa saat lagi
                <span class="dots" aria-hidden="true">
                    <span></span><span></span><span></span>
                </span>
            </p>
            <div class="domain">apitool.gwk.web.id</div>
            <div class="meta">HTTP 503 &middot; Service Temporarily Unavailable</div>
        </section>
    </main>
</body>
</html>
